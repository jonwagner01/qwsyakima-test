<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Doctor of Yakima | QWS</title>
<meta name="description" content="Water treatment services. Contact Water Doctor of Yakima by phone or email.">
<style>
  :root { --bg:#f5f7fa; --card:#ffffff; --text:#222222; --muted:#555555; --accent:#0b5ea8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --card:#1d232a; --text:#eef1f4; --muted:#a9b3bd; --accent:#6db3f2; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text);
    text-align: center; padding: 1.5rem;
  }
  .card {
    max-width: 520px; width: 100%; background: var(--card);
    padding: 2.5rem 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  img { max-width: 240px; width: 100%; height: auto; margin-bottom: 1.5rem; }
  h1 { margin: 0 0 1rem; font-size: 1.6rem; }
  p { margin: .75rem 0; line-height: 1.6; color: var(--muted); }
  .contact { margin-top: 1.75rem; }
  .contact a {
    display: block; margin: .6rem 0; font-size: 1.25rem; font-weight: bold;
    color: var(--accent); text-decoration: none;
  }
  .contact a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="card">
    <img src="QWS_logo.png" alt="QWS logo">
    <h1>Thanks for stopping by</h1>
    <p>We are here to provide water treatment services.</p>
    <p>For questions or service, please call or email our office.</p>
    <div class="contact">
      <a href="tel:5095771589">509-577-1589</a>
      <a href="mailto:office@qwsyakima.com">office@qwsyakima.com</a>
    </div>
  </main>
</body>
</html>
